<svg width="900" height="300" viewBox="0 0 900 300" fill="none"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GuilhermeGms3 GitHub activity</title>
  <desc id="desc">Self-hosted repository, follower and language statistics.</desc>
  <style>
    .root { fill: #070b12; stroke: #263241; stroke-width: 1.5; }
    .metric-card { fill: #0d141e; stroke: #263241; }
    .heading { fill: #f0f6fc; font: 700 20px "Fira Code", Consolas, monospace; }
    .prompt { fill: #00e5ff; font: 700 13px "Fira Code", Consolas, monospace; }
    .muted { fill: #7d8b99; font: 500 12px "Fira Code", Consolas, monospace; }
    .metric-label { fill: #7d8b99; font: 700 11px "Fira Code", Consolas, monospace; letter-spacing: 1px; }
    .metric-value { fill: #f0f6fc; font: 800 25px "Fira Code", Consolas, monospace; }
    .legend { fill: #b8c4ce; font: 600 12px "Fira Code", Consolas, monospace; }
    .status { fill: #39d353; font: 700 11px "Fira Code", Consolas, monospace; }
    .scan { animation: scan 4s linear infinite; opacity: .28; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes scan { from { transform: translateX(-180px); } to { transform: translateX(1080px); } }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
  <rect x="1" y="1" width="898" height="298" rx="18" class="root"/>
  <rect class="scan" x="0" y="1" width="180" height="298" fill="url(#scanGradient)"/>

  <text x="28" y="37" class="prompt">$ github telemetry --owner GuilhermeGms3</text>
  <text x="28" y="63" class="heading">Repository Activity</text>
  <circle cx="813" cy="40" r="5" fill="#39d353" class="pulse"/>
  <text x="826" y="44" class="status">SELF-HOSTED</text>


    <g transform="translate(28 78)">
      <rect width="196" height="78" rx="13" class="metric-card"/>
      <text x="18" y="27" class="metric-label">REPOSITORIES</text>
      <text x="18" y="59" class="metric-value">21</text>
    </g>
    <g transform="translate(246 78)">
      <rect width="196" height="78" rx="13" class="metric-card"/>
      <text x="18" y="27" class="metric-label">STARS</text>
      <text x="18" y="59" class="metric-value">10</text>
    </g>
    <g transform="translate(464 78)">
      <rect width="196" height="78" rx="13" class="metric-card"/>
      <text x="18" y="27" class="metric-label">FOLLOWERS</text>
      <text x="18" y="59" class="metric-value">12</text>
    </g>
    <g transform="translate(682 78)">
      <rect width="196" height="78" rx="13" class="metric-card"/>
      <text x="18" y="27" class="metric-label">FORKS</text>
      <text x="18" y="59" class="metric-value">0</text>
    </g>

  <text x="28" y="184" class="muted">APPLICATION LANGUAGES</text>
  <clipPath id="barClip"><rect x="28" y="197" width="844" height="10" rx="5"/></clipPath>
  <g clip-path="url(#barClip)"><rect x="28.00" y="197" width="314.86" height="10" fill="#00e5ff"/><rect x="342.86" y="197" width="281.61" height="10" fill="#7c3aed"/><rect x="624.47" y="197" width="218.44" height="10" fill="#2ea043"/><rect x="842.92" y="197" width="18.86" height="10" fill="#f59e0b"/><rect x="861.77" y="197" width="8.41" height="10" fill="#f43f5e"/><rect x="870.18" y="197" width="1.82" height="10" fill="#3b82f6"/></g>
  <circle cx="30" cy="227" r="4" fill="#00e5ff"/><text x="42" y="231" class="legend">JavaScript 37%</text><circle cx="315" cy="227" r="4" fill="#7c3aed"/><text x="327" y="231" class="legend">TypeScript 33%</text><circle cx="600" cy="227" r="4" fill="#2ea043"/><text x="612" y="231" class="legend">Java 26%</text><circle cx="30" cy="252" r="4" fill="#f59e0b"/><text x="42" y="256" class="legend">Kotlin 2%</text><circle cx="315" cy="252" r="4" fill="#f43f5e"/><text x="327" y="256" class="legend">Python 1.0%</text><circle cx="600" cy="252" r="4" fill="#3b82f6"/><text x="612" y="256" class="legend">PowerShell 0.2%</text>

  <text x="28" y="284" class="muted">recent signals: muse-studio  /  Impressora_Xerox  /  kiseki-library-android</text>

  <defs>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="180" y2="0">
      <stop stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
