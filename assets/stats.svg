<svg xmlns="http://www.w3.org/2000/svg" width="880" height="276" viewBox="0 0 880 276" role="img" aria-labelledby="title desc">
  <title id="title">GitHub telemetry</title><desc id="desc">Repository and language statistics</desc>
  <style>
