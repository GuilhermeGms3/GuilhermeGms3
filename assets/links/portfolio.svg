<svg xmlns="http://www.w3.org/2000/svg" width="220" height="92" viewBox="0 0 220 92" role="img" aria-labelledby="title desc">
  <title id="title">PORTFOLIO</title><desc id="desc">Open PORTFOLIO</desc>
  <style>
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
    .ui { font-family: "Segoe UI", Arial, sans-serif; }
    .scan { animation: scan 6s linear infinite; opacity: .16; }
    .blink { animation: blink 1.1s steps(2,start) infinite; }
