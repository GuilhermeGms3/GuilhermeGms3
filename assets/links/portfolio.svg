    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="220" height="92" rx="16" fill="#05080d"/>
  <rect x="1" y="1" width="218" height="90" rx="15" fill="none" stroke="#1f3545" stroke-width="2"/>
  <rect x="10" y="10" width="200" height="72" rx="12" fill="#0a111a" stroke="#1f3545"/>
  <rect x="22" y="25" width="42" height="42" rx="9" fill="#a78bfa" opacity=".15" stroke="#a78bfa"/>
  <text x="43" y="52" text-anchor="middle" class="mono" font-size="16" font-weight="800" fill="#a78bfa">//</text>
  <text x="76" y="42" class="mono" font-size="11" fill="#7e95a3">OPEN CHANNEL</text>
  <text x="76" y="62" class="mono" font-size="14" font-weight="700" fill="#e6f1f5">PORTFOLIO</text>
