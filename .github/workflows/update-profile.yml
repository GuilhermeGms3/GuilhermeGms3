name: Update profile console

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "tools/profile/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-console
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/profile/generate.py

      - name: Publish refreshed assets
        run: |
          if git diff --quiet -- assets tools/profile/data.json; then
            echo "Profile assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets tools/profile/data.json
          git commit -m "chore: refresh profile console"
          git push
